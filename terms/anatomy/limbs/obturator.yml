term: obturator
forms: [obturator process, obturator processes, obturator foramen, obturator notch]
definition: >-
  Names features of the lower hip bones near the obturator nerve: the opening or notch in the pubis
  that the nerve passed through, and the obturator process of the ischium.
etymology: Latin obturare, "to stop up".
see_also: [ischium, pubis]
