term: hyposphene
forms: [hyposphenes, hypantrum, hypantra, hyposphene-hypantrum]
definition: >-
  An extra joint between back vertebrae: a wedge below the joint surfaces at the back of one
  vertebra, the hyposphene, fits into a notch, the hypantrum, in the next.
etymology: Greek hypo, "below", and sphen, "wedge".
see_also: [zygapophysis]
