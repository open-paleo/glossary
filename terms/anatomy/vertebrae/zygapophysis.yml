term: zygapophysis
forms: [zygapophyses, prezygapophysis, prezygapophyses, prezygapophyseal, postzygapophysis, postzygapophyses, postzygapophyseal]
definition: >-
  One of the paired projections that link one vertebra to the next. The prezygapophyses at the front
  of a vertebra fit against the postzygapophyses at the back of the one ahead.
etymology: Greek zygon, "yoke", and apophysis, "offshoot".
see_also: [vertebra, hyposphene]
