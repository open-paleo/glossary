term: temporal fenestra
forms: [temporal fenestrae, supratemporal fenestra, supratemporal fenestrae, infratemporal fenestra, infratemporal fenestrae, laterotemporal fenestra, laterotemporal fenestrae, supratemporal, infratemporal, laterotemporal]
definition: >-
  One of the openings in the skull behind the eye socket, through which jaw muscles passed: one on
  the skull roof (supratemporal) and one on each side (infratemporal or laterotemporal).
see_also: [fenestra, orbit]
