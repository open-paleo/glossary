term: occiput
forms: [occipital, occipital condyle, supraoccipital, basioccipital, paroccipital, paroccipital process, paroccipital processes]
definition: >-
  The back of the skull, around the opening for the spinal cord. The occipital condyle is the knob
  where the skull meets the neck; the paroccipital processes stick out to the sides.
etymology: Latin, "back of the head".
see_also: [braincase, condyle]
