term: antorbital fenestra
forms: [antorbital fenestrae, antorbital, antorbital fossa]
definition: >-
  An opening in the side of the skull between the nostril and the eye socket. The antorbital fossa
  is the hollow around it.
etymology: Latin ante, "before", orbita, the eye socket, and fenestra, "window".
see_also: [fenestra, naris]
