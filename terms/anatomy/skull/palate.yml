term: palate
forms: [palates, palatal, palatine, palatines, pterygoid, pterygoids, ectopterygoid, ectopterygoids]
definition: >-
  The roof of the mouth. In dinosaurs it is made of several paired bones, among them the palatines,
  pterygoids and ectopterygoids.
etymology: Latin palatum.
see_also: [braincase]
