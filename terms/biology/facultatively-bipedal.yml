term: facultatively bipedal
forms: [facultative biped, facultative bipeds, facultative bipedality, facultative bipedalism]
definition: >-
  Able to walk on two legs or on four, and to switch between them. Such an animal might walk slowly
  or feed on all fours, and rise onto its hind legs to run or to use its hands.
etymology: Latin facultas, "ability".
see_also: [bipedal, quadrupedal]
