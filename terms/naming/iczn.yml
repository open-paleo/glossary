term: ICZN
forms: [International Commission on Zoological Nomenclature, International Code of Zoological Nomenclature]
definition: >-
  The International Commission on Zoological Nomenclature, which keeps the rules for naming animals
  and settles hard cases in rulings called Opinions. ICZN also stands for the rules themselves, the
  International Code of Zoological Nomenclature.
see_also: [valid, nomen-rejectum]
