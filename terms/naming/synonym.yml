term: synonym
forms: [synonyms, synonymy, synonymized, junior synonym, junior synonyms, senior synonym]
definition: >-
  One of two or more names given to the same animal. The oldest name usually takes priority as the
  senior synonym; later names become junior synonyms and fall out of use.
etymology: Greek syn, "together", and onoma, "name".
see_also: [valid, nomen-dubium]
