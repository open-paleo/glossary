term: early-diverging
forms: [early diverging, earliest-diverging, basal, basalmost]
exceptions: [basal tubera, basal tuber, basal skull length]
definition: >-
  Describes a member of a group that branched off early in the group's family tree, near its base.
  It need not be older or simpler than its relatives. Also called basal.
see_also: [derived]
