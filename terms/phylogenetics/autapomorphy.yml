term: autapomorphy
forms: [autapomorphies, autapomorphic]
definition: >-
  A feature found in only one species or genus, which sets it apart from all its relatives.
  Autapomorphies show that a name represents a distinct animal.
etymology: Greek autos, "self", apo, "away from", and morphe, "form".
see_also: [synapomorphy, plesiomorphic]
