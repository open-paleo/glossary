term: synapomorphy
forms: [synapomorphies]
definition: >-
  A new feature shared by the members of a group, inherited from their common ancestor, that sets
  the group apart from others. Synapomorphies are the evidence for a clade.
etymology: Greek syn, "together", apo, "away from", and morphe, "form".
see_also: [autapomorphy, clade]
